[project]
name = "curvature-enthusiasm"
version = "0.0.1"
description = "Code release for the paper: Curvature Enthusiasm — Correspondence-Free Interpolation and Matching of Articulated 3D Shapes using Compressed Normal Cycles"
readme = "readme.md"  # <-- match your filename's case
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Adam Hartshorne", email = "ath35@bath.ac.uk" },
  { name = "Allen Paul", email = "ap2746@bath.ac.uk" },
  { name = "Tony Shardlow", email = "t.shardlow@bath.ac.uk" },
  { name = "Neill D F Campbell", email = "neill.campbell@ucl.ac.uk" }
]

keywords = [
  "3D shapes", "shape interpolation", "diffeomorphisms",
  "normal cycles", "articulated models", "computer graphics"
]

dependencies = [
    "optax==0.2.6",
    "trimesh==4.8.2",
    "einops==0.8.1",
    "jax-dataloader==0.1.3",
    "probdiffeq==0.8.0",
    "point-cloud-utils==0.34.0",
    "pandas==2.3.2",
    "equinox==0.13.1",
    "tqdm==4.67.1",
    "libigl==2.6.1",
    "pykeops==2.3",
    "polyscope==2.5.0",
    "viser==1.0.10",
    "matplotlib==3.10.6",
    "wandb==0.22.0",
    "pydantic==2.12.3",
    "jaxlie",
    "wadler_lindig",
    "pyvista",
    "plyfile",
    "scikit-learn",
    "pytetwild",
    "open3d",
    "seaborn",
    # Git dependencies
    "torch2jax @ git+https://github.com/rdyro/torch2jax.git",
    "chumpy @ git+https://github.com/mattloper/chumpy@9b045ff5d6588a24a0bab52c83f032e2ba433e17",
]


